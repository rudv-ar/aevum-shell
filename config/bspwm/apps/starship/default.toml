"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](bg:#94ccff)\
[ 󰣇 ](bg:#94ccff fg:#0f1113)\
[](bg:#4397d6 fg:#94ccff)\
$directory\
[](fg:#4397d6 bg:#004b74)\
$git_branch\
$git_status\
[](fg:#004b74 bg:#2f3033)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#2f3033 bg:#242628)\
$time\
[ ](fg:#242628)\
\n$character"""

scan_timeout = 500
command_timeout = 2000

[directory]
style = "fg:#e2e2e5 bg:#4397d6"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#004b74"
format = '[[ $symbol $branch ](fg:#4397d6 bg:#004b74)]($style)'

[git_status]
style = "bg:#004b74"
format = '[[($all_status$ahead_behind )](fg:#4397d6 bg:#004b74)]($style)'

[nodejs]
symbol = ""
style = "bg:#2f3033"
format = '[[ $symbol ($version) ](fg:#4397d6 bg:#2f3033)]($style)'

[rust]
symbol = ""
style = "bg:#2f3033"
format = '[[ $symbol ($version) ](fg:#4397d6 bg:#2f3033)]($style)'

[golang]
symbol = ""
style = "bg:#2f3033"
format = '[[ $symbol ($version) ](fg:#4397d6 bg:#2f3033)]($style)'

[php]
symbol = ""
style = "bg:#2f3033"
format = '[[ $symbol ($version) ](fg:#4397d6 bg:#2f3033)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#242628"
format = '[[  $time ](fg:#a6acb3 bg:#242628)]($style)'
